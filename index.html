<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Diary</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

  <!-- Cards container section -->

  <section id="popular-movies-block" class="w-full my-10">

    <h2 class="text-2xl font-bold mb-4 max-w-6xl mx-auto px-4">
      Popular Movies
    </h2>


    <div class="relative max-w-6xl mx-auto">

      <!-- Left Arrow -->
      <button class="prev-btn absolute -left-4 top-1/2 -translate-y-1/2 z-10
             bg-black/60 hover:bg-black/80 text-white p-3 rounded-full">
        ◀
      </button>

      <!-- Slider -->
      <div id="popular-movies-card-container"
        class="flex-nowrap movie-slider flex gap-4 px-4 overflow-x-auto overflow-y-hidden scroll-smooth">
      
        <!-- cards will be inserted here -->
      
      </div>

      <!-- Right Arrow -->
      <button class="next-btn absolute -right-4 top-1/2 -translate-y-1/2 z-10
             bg-black/60 hover:bg-black/80 text-white p-3 rounded-full">
        ▶
      </button>

    </div>
  </section>


  <section id="latest-release-block" class="w-full my-10">

    <h2 class="text-2xl font-bold mb-4 max-w-6xl mx-auto px-4">
      Latest Releases
    </h2>


    <div class="relative max-w-6xl mx-auto">

      <!-- Left Arrow -->
      <button class="prev-btn absolute -left-4 top-1/2 -translate-y-1/2 z-10
             bg-black/60 hover:bg-black/80 text-white p-3 rounded-full">
        ◀
      </button>

      <!-- Slider -->
      <div id="latest-release-card-container" class="flex-nowrap movie-slider flex gap-4 px-4 overflow-x-auto overflow-y-hidden scroll-smooth">
      
        <!-- cards will be inserted here -->
      
      </div>

      <!-- Right Arrow -->
      <button class="next-btn absolute -right-4 top-1/2 -translate-y-1/2 z-10
             bg-black/60 hover:bg-black/80 text-white p-3 rounded-full">
        ▶
      </button>

    </div>
  </section>

  <section id="all-movies-block" class="w-full my-10">

    <h2 class="text-2xl font-bold mb-4 max-w-6xl mx-auto px-4">
      All Movies
    </h2>

    <div class="relative max-w-6xl mx-auto">

      <!-- Left Arrow -->
      <button class="prev-btn absolute -left-4 top-1/2 -translate-y-1/2 z-10
             bg-black/60 hover:bg-black/80 text-white p-3 rounded-full">
        ◀
      </button>

      <!-- Slider -->
      <div id="all-movies-card-container"
        class="flex-nowrap movie-slider flex gap-4 px-4 overflow-x-auto overflow-y-hidden scroll-smooth">

        <!-- cards will be inserted here -->
      
      </div>

      <!-- Right Arrow -->
      <button class="next-btn absolute -right-4 top-1/2 -translate-y-1/2 z-10
             bg-black/60 hover:bg-black/80 text-white p-3 rounded-full">
        ▶
      </button>

    </div>
  </section>
  <!-- End of cards container section -->

  <script src="main.js"></script>
</body>

</html>
