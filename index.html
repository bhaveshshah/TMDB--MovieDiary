<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Diary</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>

  <!-- Cards container section -->

    <section id="popular-movies-block" class="mx-auto p-4">
      <h2 class="text-3xl font-bold mb-4">Popular Movies</h2>
      <div
        id="popular-movies-card-container"
        class="grid grid-cols-4 gap-4"
      >
      <!-- Here, cards will be displayed by "popularity" rate fetched from TMDB API. -->

      </div>
    <section id="latest-release-block" class="m-2">

      <h2 class="text-3xl font-bold mb-4">Latest Releases</h2>
      <div
        id="latest-release-card-container"
        class="grid grid-cols-4 gap-4"


      >
      <!-- Here, movies will be displayed based on their release date, fetched from TMDB API. -->
      </div>
    </section>

    <section id="browse-all-block" class="m-2">
      <h2 class="text-3xl font-bold mb-4">All Movies</h2>
      <div
        id="browse-all-card-container"
        class="grid grid-cols-4 gap-4"
      >
      <!-- Here, movies will be displayed based on their ratings, fetched from TMDB API. -->
      </div>
    </section>

  <!-- End of cards container section -->

    <script src="main.js"></script>
  </body>
</html>
